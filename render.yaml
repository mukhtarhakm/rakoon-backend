services:
  - type: web
    name: rakoon-backend
    runtime: python
    region: singapore  # Pilih region terdekat (Asia)
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false        # Akan diisi manual di Render Dashboard
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false        # Diisi manual di Render Dashboard
      - key: PRIMARY_VISION_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: ADMIN_EMAILS
        sync: false        # Diisi manual di Render Dashboard
    healthCheckPath: /health
